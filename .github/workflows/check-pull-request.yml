name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  packages: read

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Test
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0
      - run: dotnet test
      # The build writes the OpenAPI documents. v1 (openapi.json) is the contract frontends generate clients from.
      # Linted with Vacuum, as Manage Obligations: findings are reported but don't fail the build yet.
      - name: Check openapi with Vacuum
        run: |
          docker run --rm -v "$PWD:/work:ro" \
            dshanley/vacuum:latest@sha256:e13b08c36d5858753cafe677282bb38d9b7ca7945f3a3afba403ed47520dc5af \
            lint -d -r .vacuum.yml WasteSubmitRegPackagingApi/openapi.json || true
      - name: Store openapi artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi.json
          path: WasteSubmitRegPackagingApi/openapi.json
    ## SonarCloud
    ## Uncomment to unable SonarCloud scan
    ## Requires project to be set up in SonarCloud
    ## and the SonarCloud token to be set in the repository secrets
