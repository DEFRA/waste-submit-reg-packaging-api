services:
  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  # Same major version as CDP's Aurora clusters. Local only, so no password is needed.
  # compose/postgres/init.sql creates the same two users CDP does: a DDL user for Liquibase and a
  # DML-only user for the app. It only runs on an empty volume: `docker compose down -v` to reset.
  postgres:
    image: postgres:16-alpine
    networks:
      - cdp-tenant
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: waste_submit_reg_packaging_api
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./compose/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d waste_submit_reg_packaging_api']
      interval: 2s
      timeout: 5s
      retries: 15

  # Applies ./changelog as the DDL user, as CDP's "Apply Changelog" does, then exits.
  liquibase:
    image: liquibase/liquibase:5.0.1
    networks:
      - cdp-tenant
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./changelog:/liquibase/changelog:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        liquibase lpm add postgresql --global &&
        liquibase
        --search-path=/liquibase/changelog
        --changelog-file=db.changelog.xml
        --url=jdbc:postgresql://postgres:5432/waste_submit_reg_packaging_api
        --username=waste_submit_reg_packaging_api_ddl
        update

  ################################################################################

  # your-frontend:
  #   image: defradigital/your-frontend:${YOUR_FRONTEND_VERSION:-latest}
  #   ports:
  #     - '3000:3000'
  #   links:
  #     - 'floci:floci'
  #     - 'redis:redis'
  #   depends_on:
  #     floci:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #   env_file:
  #     - 'compose/aws.env'
  #   environment:
  #     PORT: 3000
  #     NODE_ENV: development
  #     REDIS_HOST: redis
  #     USE_SINGLE_INSTANCE_CACHE: true
  #   networks:
  #     - cdp-tenant

  your-backend:
    build: ./
    ports:
      - '8085:8085'
    links:
      - 'floci:floci'
      - 'postgres:postgres'
    depends_on:
      floci:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    env_file:
      - 'compose/aws.env'
    environment:
      ASPNETCORE_URLS: http://+:8085
      # The local-only Developer client (see appsettings.Development.json), as compose runs in Production.
      Acl__Clients__Developer__Type: ApiKey
      Acl__Clients__Developer__Secret: developer-pwd
      Acl__Clients__Developer__Scopes__0: read
      Acl__Clients__Developer__Scopes__1: write
      Postgres__Host: postgres
      Postgres__UseIamAuthentication: false
      Postgres__SslMode: Disable
    networks:
      - cdp-tenant

################################################################################

volumes:
  postgres-data:

networks:
  cdp-tenant:
    driver: bridge
