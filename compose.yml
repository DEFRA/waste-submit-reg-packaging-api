services:
  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data

  # Same major version as CDP's Aurora clusters. Local only, so no password is needed.
  postgres:
    image: postgres:16-alpine
    networks:
      - cdp-tenant
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: waste_submit_reg_packaging_api
      POSTGRES_USER: waste_submit_reg_packaging_api
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ################################################################################

  # your-frontend:
  #   image: defradigital/your-frontend:${YOUR_FRONTEND_VERSION:-latest}
  #   ports:
  #     - '3000:3000'
  #   links:
  #     - 'floci:floci'
  #     - 'redis:redis'
  #   depends_on:
  #     floci:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #   env_file:
  #     - 'compose/aws.env'
  #   environment:
  #     PORT: 3000
  #     NODE_ENV: development
  #     REDIS_HOST: redis
  #     USE_SINGLE_INSTANCE_CACHE: true
  #   networks:
  #     - cdp-tenant

  your-backend:
    build: ./
    ports:
      - '8085:8085'
    links:
      - 'floci:floci'
      - 'mongodb:mongodb'
      - 'postgres:postgres'
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_started
      postgres:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      ASPNETCORE_URLS: http://+:8085
      Mongo__DatabaseUri: mongodb://mongodb:27017/
      Postgres__Host: postgres
      Postgres__UseIamAuthentication: false
      Postgres__SslMode: Disable
    networks:
      - cdp-tenant

################################################################################

volumes:
  mongodb-data:
  postgres-data:

networks:
  cdp-tenant:
    driver: bridge
